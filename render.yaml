services:
  # ─── Web Dashboard ─────────────────────────────────────────
  - type: web
    name: tgparser-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tgparser-db
          property: connectionString
    # Starter plan required for always-on web service

  # ─── Cron Job: парсинг каждые 5 минут ──────────────────────
  - type: cron
    name: tgparser-cron
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/5 * * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tgparser-db
          property: connectionString
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_STRING_SESSION
        sync: false
      - key: CHANNEL_USERNAME
        value: "markettwits"
      - key: HISTORY
        value: "0"
